<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList</title>
</head>
<body>
    <div class="container">
        <input type="text" hidden id="project" value="Default">
        <div class="nav">
            <div class="user-container">
                <div class="user">WilliamCatLovrr</div>
            </div>
            <div class="projects-container">
                <h1>Projects</h1>
                <div class="project">Default</div>
                <div class="add-project">
                    <label for="projectName">Project Name</label>
                    <div class="d-flex">
                        <input type="text" id="projectName">
                        <button class="btn-save-project">Save</button>
                    </div>
                </div>
                <div class="btn-new-project">New Project</div>
            </div>
        </div>
        <div class="content">
            <h1 class="project-title"></h1>
            <div class="todo-container">
                <div class="btn-new">+</div>
            </div>
        </div>
    </div>
</body>
</html>
